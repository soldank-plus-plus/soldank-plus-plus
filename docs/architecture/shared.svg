<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" aria-labelledby="shared-title shared-desc"><title id="shared-title">shared architecture diagram</title><desc id="shared-desc">Numbered elements and directed relationships. The following table provides every relationship in text.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#677e93"/></marker></defs><path d="M510,100 L585,100" stroke="#677e93" stroke-width="2" opacity=".65" fill="none" marker-end="url(#arrow)"/><path d="M270,175 L270,240" stroke="#677e93" stroke-width="2" opacity=".65" fill="none" marker-end="url(#arrow)"/><path d="M270,175 L825,240" stroke="#677e93" stroke-width="2" opacity=".65" fill="none" marker-end="url(#arrow)"/><path d="M825,175 L270,455" stroke="#677e93" stroke-width="2" opacity=".65" fill="none" marker-end="url(#arrow)"/><path d="M270,240 L825,175" stroke="#677e93" stroke-width="2" opacity=".65" fill="none" marker-end="url(#arrow)"/><rect x="30" y="25" width="480" height="150" rx="8" fill="#e1effb" stroke="#3978a8" stroke-width="2"/><text x="48" y="57" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#182b40">1. World / IWorld</text><text x="48" y="84" font-family="system-ui,sans-serif" font-size="15" font-weight="normal" fill="#182b40">Component · simulation facade</text><text x="48" y="111" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">Explicit ticks and optional fixed-timestep loop.</text><rect x="585" y="25" width="480" height="150" rx="8" fill="#e1effb" stroke="#3978a8" stroke-width="2"/><text x="603" y="57" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#182b40">2. StateManager and entities</text><text x="603" y="84" font-family="system-ui,sans-serif" font-size="15" font-weight="normal" fill="#182b40">Component · mutable state</text><text x="603" y="111" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">Soldiers, bullets, items, map and game tick.</text><rect x="30" y="240" width="480" height="150" rx="8" fill="#e1effb" stroke="#3978a8" stroke-width="2"/><text x="48" y="272" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#182b40">3. Physics and animation</text><text x="48" y="299" font-family="system-ui,sans-serif" font-size="15" font-weight="normal" fill="#182b40">Component · simulation rules</text><text x="48" y="326" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">Movement, weapons, collisions, skeletons and</text><text x="48" y="353" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">states.</text><rect x="585" y="240" width="480" height="150" rx="8" fill="#e1effb" stroke="#3978a8" stroke-width="2"/><text x="603" y="272" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#182b40">4. Game-mode runtime</text><text x="603" y="299" font-family="system-ui,sans-serif" font-size="15" font-weight="normal" fill="#182b40">Component · match rules</text><text x="603" y="326" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">Built-in modes, scoring and match progression.</text><rect x="30" y="455" width="480" height="150" rx="8" fill="#e1effb" stroke="#3978a8" stroke-width="2"/><text x="48" y="487" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#182b40">5. Maps and data loading</text><text x="48" y="514" font-family="system-ui,sans-serif" font-size="15" font-weight="normal" fill="#182b40">Component · local data</text><text x="48" y="541" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">PMS documents, animation and weapon data.</text><rect x="585" y="455" width="480" height="150" rx="8" fill="#e1effb" stroke="#3978a8" stroke-width="2"/><text x="603" y="487" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#182b40">6. Communication protocol</text><text x="603" y="514" font-family="system-ui,sans-serif" font-size="15" font-weight="normal" fill="#182b40">Component · shared wire contract</text><text x="603" y="541" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">NetworkEvent, packets, messages and dispatcher.</text></svg>
