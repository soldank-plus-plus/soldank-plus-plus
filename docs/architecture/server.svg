<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 895" role="img" aria-labelledby="server-title server-desc"><title id="server-title">server architecture diagram</title><desc id="server-desc">Numbered elements and directed relationships. The following table provides every relationship in text.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#677e93"/></marker></defs><path d="M510,100 L585,100" stroke="#677e93" stroke-width="2" opacity=".65" fill="none" marker-end="url(#arrow)"/><path d="M270,175 L825,670" stroke="#677e93" stroke-width="2" opacity=".65" fill="none" marker-end="url(#arrow)"/><path d="M825,175 L270,240" stroke="#677e93" stroke-width="2" opacity=".65" fill="none" marker-end="url(#arrow)"/><path d="M510,315 L585,315" stroke="#677e93" stroke-width="2" opacity=".65" fill="none" marker-end="url(#arrow)"/><path d="M825,175 L825,240" stroke="#677e93" stroke-width="2" opacity=".65" fill="none" marker-end="url(#arrow)"/><path d="M825,175 L270,455" stroke="#677e93" stroke-width="2" opacity=".65" fill="none" marker-end="url(#arrow)"/><path d="M825,175 L825,455" stroke="#677e93" stroke-width="2" opacity=".65" fill="none" marker-end="url(#arrow)"/><path d="M825,455 L270,390" stroke="#677e93" stroke-width="2" opacity=".65" fill="none" marker-end="url(#arrow)"/><path d="M825,175 L270,670" stroke="#677e93" stroke-width="2" opacity=".65" fill="none" marker-end="url(#arrow)"/><rect x="30" y="25" width="480" height="150" rx="8" fill="#e1effb" stroke="#3978a8" stroke-width="2"/><text x="48" y="57" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#182b40">1. Application / bootstrap</text><text x="48" y="84" font-family="system-ui,sans-serif" font-size="15" font-weight="normal" fill="#182b40">Component · composition root</text><text x="48" y="111" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">Loads config; initializes GNS and daScript;</text><text x="48" y="138" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">wires services.</text><rect x="585" y="25" width="480" height="150" rx="8" fill="#e1effb" stroke="#3978a8" stroke-width="2"/><text x="603" y="57" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#182b40">2. ServerRuntime</text><text x="603" y="84" font-family="system-ui,sans-serif" font-size="15" font-weight="normal" fill="#182b40">Component · fixed-timestep orchestration</text><text x="603" y="111" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">Polls networking, ticks world, routes events,</text><text x="603" y="138" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">replicates.</text><rect x="30" y="240" width="480" height="150" rx="8" fill="#e1effb" stroke="#3978a8" stroke-width="2"/><text x="48" y="272" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#182b40">3. Network host and sessions</text><text x="48" y="299" font-family="system-ui,sans-serif" font-size="15" font-weight="normal" fill="#182b40">Component · GameServer / PlayerSessionManager</text><text x="48" y="326" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">Transport, entry/player poll groups and player</text><text x="48" y="353" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">lifecycle.</text><rect x="585" y="240" width="480" height="150" rx="8" fill="#e1effb" stroke="#3978a8" stroke-width="2"/><text x="603" y="272" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#182b40">4. Command queues</text><text x="603" y="299" font-family="system-ui,sans-serif" font-size="15" font-weight="normal" fill="#182b40">Component · ServerCommandQueues</text><text x="603" y="326" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">Buffers simulation commands and selects player</text><text x="603" y="353" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">input.</text><rect x="30" y="455" width="480" height="150" rx="8" fill="#e1effb" stroke="#3978a8" stroke-width="2"/><text x="48" y="487" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#182b40">5. Authoritative world</text><text x="48" y="514" font-family="system-ui,sans-serif" font-size="15" font-weight="normal" fill="#182b40">Component · shared_lib</text><text x="48" y="541" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">Owns match state and advances the simulation.</text><rect x="585" y="455" width="480" height="150" rx="8" fill="#e1effb" stroke="#3978a8" stroke-width="2"/><text x="603" y="487" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#182b40">6. Replication and event routing</text><text x="603" y="514" font-family="system-ui,sans-serif" font-size="15" font-weight="normal" fill="#182b40">Component · ReplicationService</text><text x="603" y="541" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">Sends tick state and simulation events to</text><text x="603" y="568" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">clients.</text><rect x="30" y="670" width="480" height="150" rx="8" fill="#e1effb" stroke="#3978a8" stroke-width="2"/><text x="48" y="702" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#182b40">7. LobbyClient</text><text x="48" y="729" font-family="system-ui,sans-serif" font-size="15" font-weight="normal" fill="#182b40">Component · HTTP adapter</text><text x="48" y="756" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">Registers configured server with external lobby.</text><rect x="585" y="670" width="480" height="150" rx="8" fill="#e1effb" stroke="#3978a8" stroke-width="2"/><text x="603" y="702" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#182b40">8. Scripting engine</text><text x="603" y="729" font-family="system-ui,sans-serif" font-size="15" font-weight="normal" fill="#182b40">Component · soldank_server_scripting</text><text x="603" y="756" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">IScriptingEngine implementation backed by</text><text x="603" y="783" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">daScript.</text></svg>
