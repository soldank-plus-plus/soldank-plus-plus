<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" aria-labelledby="client-title client-desc"><title id="client-title">client architecture diagram</title><desc id="client-desc">Numbered elements and directed relationships. The following table provides every relationship in text.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#677e93"/></marker></defs><path d="M510,100 L585,100" stroke="#677e93" stroke-width="2" opacity=".65" fill="none" marker-end="url(#arrow)"/><path d="M270,175 L270,240" stroke="#677e93" stroke-width="2" opacity=".65" fill="none" marker-end="url(#arrow)"/><path d="M270,175 L825,240" stroke="#677e93" stroke-width="2" opacity=".65" fill="none" marker-end="url(#arrow)"/><path d="M270,175 L270,455" stroke="#677e93" stroke-width="2" opacity=".65" fill="none" marker-end="url(#arrow)"/><path d="M825,175 L825,455" stroke="#677e93" stroke-width="2" opacity=".65" fill="none" marker-end="url(#arrow)"/><path d="M270,390 L825,455" stroke="#677e93" stroke-width="2" opacity=".65" fill="none" marker-end="url(#arrow)"/><path d="M825,390 L825,455" stroke="#677e93" stroke-width="2" opacity=".65" fill="none" marker-end="url(#arrow)"/><path d="M510,530 L585,530" stroke="#677e93" stroke-width="2" opacity=".65" fill="none" marker-end="url(#arrow)"/><rect x="30" y="25" width="480" height="150" rx="8" fill="#e1effb" stroke="#3978a8" stroke-width="2"/><text x="48" y="57" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#182b40">1. Application and mode control</text><text x="48" y="84" font-family="system-ui,sans-serif" font-size="15" font-weight="normal" fill="#182b40">Component · Application / ClientRuntime</text><text x="48" y="111" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">Composes services; selects gameplay or editor</text><text x="48" y="138" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">input context.</text><rect x="585" y="25" width="480" height="150" rx="8" fill="#e1effb" stroke="#3978a8" stroke-width="2"/><text x="603" y="57" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#182b40">2. Input and gameplay</text><text x="603" y="84" font-family="system-ui,sans-serif" font-size="15" font-weight="normal" fill="#182b40">Component · PlayerController / GameSession</text><text x="603" y="111" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">Converts user input into gameplay actions.</text><rect x="30" y="240" width="480" height="150" rx="8" fill="#e1effb" stroke="#3978a8" stroke-width="2"/><text x="48" y="272" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#182b40">3. Networking and prediction</text><text x="48" y="299" font-family="system-ui,sans-serif" font-size="15" font-weight="normal" fill="#182b40">Component · NetworkClientSession</text><text x="48" y="326" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">Sends inputs; tracks prediction and</text><text x="48" y="353" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">reconciliation.</text><rect x="585" y="240" width="480" height="150" rx="8" fill="#e1effb" stroke="#3978a8" stroke-width="2"/><text x="603" y="272" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#182b40">4. Editor sessions and tools</text><text x="603" y="299" font-family="system-ui,sans-serif" font-size="15" font-weight="normal" fill="#182b40">Component · EditorSession / MapEditor</text><text x="603" y="326" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">Map tools, undoable actions and play testing.</text><rect x="30" y="455" width="480" height="150" rx="8" fill="#e1effb" stroke="#3978a8" stroke-width="2"/><text x="48" y="487" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#182b40">5. Presentation</text><text x="48" y="514" font-family="system-ui,sans-serif" font-size="15" font-weight="normal" fill="#182b40">Component · Scene / RenderPipeline</text><text x="48" y="541" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">OpenGL renderers, ImGui UI, HUD and weapon</text><text x="48" y="568" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">audio.</text><rect x="585" y="455" width="480" height="150" rx="8" fill="#e1effb" stroke="#3978a8" stroke-width="2"/><text x="603" y="487" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#182b40">6. Local world</text><text x="603" y="514" font-family="system-ui,sans-serif" font-size="15" font-weight="normal" fill="#182b40">Component · shared_lib</text><text x="603" y="541" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">IWorld, simulation state and map document.</text></svg>
