<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" aria-labelledby="containers-title containers-desc"><title id="containers-title">containers architecture diagram</title><desc id="containers-desc">Numbered elements and directed relationships. The following table provides every relationship in text.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#677e93"/></marker></defs><path d="M510,100 L585,100" stroke="#677e93" stroke-width="2" opacity=".65" fill="none" marker-end="url(#arrow)"/><path d="M270,175 L270,240" stroke="#677e93" stroke-width="2" opacity=".65" fill="none" marker-end="url(#arrow)"/><path d="M825,175 L825,240" stroke="#677e93" stroke-width="2" opacity=".65" fill="none" marker-end="url(#arrow)"/><path d="M825,175 L270,455" stroke="#677e93" stroke-width="2" opacity=".65" fill="none" marker-end="url(#arrow)"/><path d="M585,530 L560,530 L560,315 L516,315" stroke="#677e93" stroke-width="2" opacity=".65" fill="none" marker-end="url(#arrow)"/><rect x="30" y="25" width="480" height="150" rx="8" fill="#e1effb" stroke="#3978a8" stroke-width="2"/><text x="48" y="57" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#182b40">1. Game client</text><text x="48" y="84" font-family="system-ui,sans-serif" font-size="15" font-weight="normal" fill="#182b40">Container · native / WebAssembly</text><text x="48" y="111" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">Input, rendering, audio, editor, local</text><text x="48" y="138" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">simulation.</text><rect x="585" y="25" width="480" height="150" rx="8" fill="#e1effb" stroke="#3978a8" stroke-width="2"/><text x="603" y="57" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#182b40">2. Game server</text><text x="603" y="84" font-family="system-ui,sans-serif" font-size="15" font-weight="normal" fill="#182b40">Container · native C++23</text><text x="603" y="111" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">Authoritative match runtime and replication.</text><rect x="30" y="240" width="480" height="150" rx="8" fill="#e1effb" stroke="#3978a8" stroke-width="2"/><text x="48" y="272" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#182b40">3. Client and tooling files</text><text x="48" y="299" font-family="system-ui,sans-serif" font-size="15" font-weight="normal" fill="#182b40">Data store · filesystem</text><text x="48" y="326" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">Maps, textures, animations, weapon definitions.</text><rect x="585" y="240" width="480" height="150" rx="8" fill="#e1effb" stroke="#3978a8" stroke-width="2"/><text x="603" y="272" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#182b40">4. Server local files</text><text x="603" y="299" font-family="system-ui,sans-serif" font-size="15" font-weight="normal" fill="#182b40">Data store · filesystem</text><text x="603" y="326" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">Configuration, maps, scripts, lobby endpoints.</text><rect x="30" y="455" width="480" height="150" rx="8" fill="#eef2f6" stroke="#3978a8" stroke-width="2"/><text x="48" y="487" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#182b40">5. Lobby / master server</text><text x="48" y="514" font-family="system-ui,sans-serif" font-size="15" font-weight="normal" fill="#182b40">External system</text><text x="48" y="541" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">Receives registration metadata.</text><rect x="585" y="455" width="480" height="150" rx="8" fill="#e1effb" stroke="#3978a8" stroke-width="2"/><text x="603" y="487" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#182b40">6. Movement scenario player</text><text x="603" y="514" font-family="system-ui,sans-serif" font-size="15" font-weight="normal" fill="#182b40">Container · optional native desktop executable</text><text x="603" y="541" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">Runs scenarios and displays or exports results.</text></svg>
