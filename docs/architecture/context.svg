<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="context-title context-desc"><title id="context-title">context architecture diagram</title><desc id="context-desc">Numbered elements and directed relationships. The following table provides every relationship in text.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#677e93"/></marker></defs><path d="M270,175 L270,240" stroke="#677e93" stroke-width="2" opacity=".65" fill="none" marker-end="url(#arrow)"/><path d="M825,175 L270,240" stroke="#677e93" stroke-width="2" opacity=".65" fill="none" marker-end="url(#arrow)"/><path d="M510,315 L585,315" stroke="#677e93" stroke-width="2" opacity=".65" fill="none" marker-end="url(#arrow)"/><path d="M270,455 L270,396" stroke="#677e93" stroke-width="2" opacity=".65" fill="none" marker-end="url(#arrow)"/><rect x="30" y="25" width="480" height="150" rx="8" fill="#eef2f6" stroke="#3978a8" stroke-width="2"/><text x="48" y="57" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#182b40">1. Player / map author</text><text x="48" y="84" font-family="system-ui,sans-serif" font-size="15" font-weight="normal" fill="#182b40">Person</text><text x="48" y="111" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">Plays local or online matches; creates maps.</text><rect x="585" y="25" width="480" height="150" rx="8" fill="#eef2f6" stroke="#3978a8" stroke-width="2"/><text x="603" y="57" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#182b40">2. Server operator</text><text x="603" y="84" font-family="system-ui,sans-serif" font-size="15" font-weight="normal" fill="#182b40">Person</text><text x="603" y="111" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">Configures and runs a game server.</text><rect x="30" y="240" width="480" height="150" rx="8" fill="#e1effb" stroke="#3978a8" stroke-width="2"/><text x="48" y="272" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#182b40">3. Soldank++</text><text x="48" y="299" font-family="system-ui,sans-serif" font-size="15" font-weight="normal" fill="#182b40">Software system</text><text x="48" y="326" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">C++23 OpenSoldat engine reimplementation.</text><rect x="585" y="240" width="480" height="150" rx="8" fill="#eef2f6" stroke="#3978a8" stroke-width="2"/><text x="603" y="272" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#182b40">4. Lobby / master server</text><text x="603" y="299" font-family="system-ui,sans-serif" font-size="15" font-weight="normal" fill="#182b40">External software system</text><text x="603" y="326" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">Accepts game-server registrations.</text><rect x="30" y="455" width="480" height="150" rx="8" fill="#eef2f6" stroke="#3978a8" stroke-width="2"/><text x="48" y="487" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#182b40">5. Developer</text><text x="48" y="514" font-family="system-ui,sans-serif" font-size="15" font-weight="normal" fill="#182b40">Person</text><text x="48" y="541" font-family="system-ui,sans-serif" font-size="17" font-weight="normal" fill="#182b40">Runs and inspects movement scenarios.</text></svg>
